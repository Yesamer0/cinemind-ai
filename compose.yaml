services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env}
      DATABASE_URL: sqlite:////state/cinemind.db
      EMBEDDINGS_PATH: /state/movie_embeddings.pkl
      HF_HOME: /state/huggingface
      OLLAMA_URL: http://ollama:11434/api/generate
    volumes:
      - ./dataset/tmdb:/app/dataset/tmdb:ro
      - backend-state:/state
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-state:/root/.ollama

volumes:
  backend-state:
  ollama-state:
